[project]
name = "movie-api"
version = "1.0.0"
description = "Movie API with TMDB integration and mulit-level caching"
authors = [
    {name = "Diljit Singh", email = "DiljitSingh22@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "pydantic-settings>=2.11.0",
    "httpx>=0.28.1",
    "redis>=6.4.0",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "prometheus-client>=0.23.1",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.40",
    "psycopg2-binary>=2.9.11",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.2.1",
    "ruff>=0.13.3",
    "mypy>=1.15.0",
    "pytest-asyncio>=1.2.0",
    "pytest-httpx>=0.35.0",
    "fakeredis[asyncio]>=2.32.0",
]

[build-system]
requires = ["setuptools>=79.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "movie_service*",
    "user_service*",
    ]

[tool.setuptools.package-data]
"*" = ["py.typed"]

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# MyPy configuration
[tool.mypy]
python_version = "3.13"
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "httpx.*",
    "jose.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "httpx: Marks tests that use the httpx_mock fixture",
    "integration: Integration tests requiring external services",
    "unit: Fast unit tests",
]
addopts = [
    "--strict-markers",
    "--cov=movie_service/src/movie_api",
    "--cov=user_service/src/user_api",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-v",
]

# Coverage configuration
[tool.coverage.run]
source = [
    "movie_service/src",
    "user_service/src"
    ]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true