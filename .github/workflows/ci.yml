name: Python CI

# Trigger the workflow on pushes to the main branch and on pull requests to main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Use the latest version of Ubuntu as the runner environment
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out the repository code
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2: Set up the specific version of Python we need
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Step 3: Install all project dependencies, including dev dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Step 4: Run the linters to check for style and type errors
      - name: Run Linters
        run: |
          ruff check .
          mypy .

      # Step 5: Run the entire test suite to ensure everything works
      - name: Run Tests
        run: |
          python -m pytest